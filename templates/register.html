<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Register</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>

<main>
  <h1>Create an account</h1>

  <form id="registerForm">
    <label for="first_name">First Name:</label>
    <input type="text" id="first_name" required><br><br>
  
    <label for="last_name">Last Name:</label>
    <input type="text" id="last_name" required><br><br>
  
    <label for="user_name">Email:</label>
    <input type="email" id="user_name" required><br><br>
  
    <label for="password">Password:</label>
    <input type="password" id="password" required><br><br>
  
    <button type="submit">Register</button>
  </form>


  <button onclick="redirectLoginPage()">Already have an account? Login</button>
</main>

<script src="{{ url_for('static', filename='js/register.js') }}"></script>
<script src="{{ url_for('static', filename='js/redirect.js') }}"></script>

</body>
</html>
